# Checks the content packs and the app's own checks, and only then publishes the site.
# If any pack has a wrong row, this fails and nothing new is published.
name: Check and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every content pack (fails on any wrong row)
        run: node scripts/validate-content.mjs
      - name: Run the app's checks
        run: node js/selftest.js
      - name: Collect the files that make up the site
        run: |
          mkdir _site
          cp -R index.html manifest.webmanifest sw.js css js icons content _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
