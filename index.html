<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2b5a87">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lab Coach">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Identity Lab Coach</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div id="banners"></div>

  <header class="app-header">
    <div class="app-header__inner">
      <p class="app-name">Identity Lab Coach</p>
      <a class="settings-link" href="#settings" data-route="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Zm7.4-2.4 1.6 1.2-1.6 2.8-1.9-.7a7 7 0 0 1-1.6.9l-.3 2h-3.2l-.3-2a7 7 0 0 1-1.6-.9l-1.9.7L5 14l1.6-1.2a7 7 0 0 1 0-1.8L5 9.8l1.6-2.8 1.9.7a7 7 0 0 1 1.6-.9l.3-2h3.2l.3 2a7 7 0 0 1 1.6.9l1.9-.7L21 9.8l-1.6 1.2a7 7 0 0 1 0 1.8Z"/></svg>
      </a>
    </div>
  </header>

  <nav class="tabbar" aria-label="Main">
    <ul class="nav-list">
      <li><a href="#today" data-route="today">Today</a></li>
      <li><a href="#plan" data-route="plan">Plan</a></li>
      <li><a href="#learn" data-route="learn">Learn</a></li>
      <li><a href="#proof" data-route="proof">Proof</a></li>
      <li><a href="#progress" data-route="progress">Progress</a></li>
    </ul>
  </nav>

  <main id="main" tabindex="-1"></main>

  <!-- Polite announcements for screen readers (phase changes, saves). -->
  <div id="announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="js/main.js"></script>
  <noscript><p class="noscript">Identity Lab Coach needs JavaScript to run.</p></noscript>
</body>
</html>
