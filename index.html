<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2b5a87">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lab Coach">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Identity Lab Coach</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div id="banners"></div>

  <header class="app-header">
    <div class="app-header__inner">
      <a class="brand" href="#today" aria-label="Identity Lab Coach, Today">
        <svg class="brand__mark" viewBox="0 0 28 28" width="28" height="28" aria-hidden="true" focusable="false"><rect x="1" y="1" width="26" height="26" rx="8" fill="currentColor"/><circle cx="14" cy="11.5" r="4" fill="none" stroke="var(--accent-text)" stroke-width="2"/><path d="M14 15.5v6" stroke="var(--accent-text)" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="app-name">Identity Lab Coach</span>
      </a>
      <nav class="tabbar" aria-label="Main">
        <ul class="nav-list">
          <li><a href="#today" data-route="today"><svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M12 4V2.5M12 21.5V20M4 12H2.5M21.5 12H20M6.3 6.3 5.2 5.2M18.8 18.8l-1.1-1.1M6.3 17.7l-1.1 1.1M18.8 5.2l-1.1 1.1M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/></svg><span>Today</span></a></li>
          <li><a href="#plan" data-route="plan"><svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M4.5 6.5A2 2 0 0 1 6.5 4.5h11a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2v-11ZM4.5 9.5h15M9 2.5v4M15 2.5v4M8 13h.01M12 13h.01M16 13h.01M8 16.5h.01M12 16.5h.01"/></svg><span>Plan</span></a></li>
          <li><a href="#learn" data-route="learn"><svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M12 6.5C10.3 5.2 8 4.5 4.5 4.5v13c3.5 0 5.8.7 7.5 2 1.7-1.3 4-2 7.5-2v-13c-3.5 0-5.8.7-7.5 2Zm0 0v13"/></svg><span>Learn</span></a></li>
          <li><a href="#proof" data-route="proof"><svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M12 3.2 14 4.6l2.4-.1.8 2.3 2 1.4-.7 2.3.7 2.3-2 1.4-.8 2.3-2.4-.1-2 1.4-2-1.4-2.4.1-.8-2.3-2-1.4.7-2.3-.7-2.3 2-1.4.8-2.3 2.4.1L12 3.2ZM9.2 11.8l1.9 1.9 3.8-3.9"/></svg><span>Career</span></a></li>
          <li><a href="#progress" data-route="progress"><svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M4.5 19.5h15M7 16v-4M11 16V8M15 16v-6M19 16V5"/></svg><span>Progress</span></a></li>
        </ul>
      </nav>
      <a class="settings-link" href="#settings" data-route="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Zm7.4-2.4 1.6 1.2-1.6 2.8-1.9-.7a7 7 0 0 1-1.6.9l-.3 2h-3.2l-.3-2a7 7 0 0 1-1.6-.9l-1.9.7L5 14l1.6-1.2a7 7 0 0 1 0-1.8L5 9.8l1.6-2.8 1.9.7a7 7 0 0 1 1.6-.9l.3-2h3.2l.3 2a7 7 0 0 1 1.6.9l1.9-.7L21 9.8l-1.6 1.2a7 7 0 0 1 0 1.8Z"/></svg>
      </a>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <!-- Polite announcements for screen readers (phase changes, saves). -->
  <div id="announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="js/main.js"></script>
  <noscript><p class="noscript">Identity Lab Coach needs JavaScript to run.</p></noscript>
</body>
</html>
